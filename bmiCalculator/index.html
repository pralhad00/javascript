<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
     <nav>
        <a href="/backgroundColorChanger/index.html">BackgroundColorChanger</a>
        <a href="/bmiCalculator/index.html" target="">BMI Calculator</a>
         <a href="/timer/index.html" >Clock</a>
          <a href="/guessTheNumer/index.html">GuessTheNumber</a>
         <a href="/home.html">All Tools</a>
    </nav>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form action="">
            <p><label for="height">Height in CM:- </label>
                <input type="text" id="height">
            </p>
            <p> <label for="weight">Weight in KG:-</label>
                <input type="text" id="weight">
            </p>

            <button type="submit">Calculate</button>
            
        </form>
        <p id="error"></p> 
        <div class="results">
        </div>
        <button id="reset" style="display: none;" >reset</button>


        <div class="guide">
            <h2>BMI WEIGHT GUIDE</h2>
            <P>Under Weight = Less than 18.6</P>
            <p>Normal Range = 18.6 - 24.9</p>
            <p>Overweight = Greater than 25.9</p>
            
        </div>

    </div>
</body>
<script src="script.js"></script>

</html>
